services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: caremetrics
      POSTGRES_PASSWORD: caremetrics
      POSTGRES_DB: caremetrics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caremetrics"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://caremetrics:caremetrics@db:5432/caremetrics
    volumes:
      - .:/code
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
