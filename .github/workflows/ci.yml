name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caremetrics
          POSTGRES_PASSWORD: caremetrics
          POSTGRES_DB: caremetrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caremetrics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://caremetrics:caremetrics@localhost:5432/caremetrics

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check migrations apply to an empty database
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest -q
